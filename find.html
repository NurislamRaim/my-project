<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск тура</title>
     <link rel="stylesheet" href="style.css">
    <style>
    body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ffecd2, #fcb69f);
    margin: 0;
    padding: 0;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    background-color: #333;
    color: white;
    padding: 10px 20px;
    text-align: center;
    width: 100%;
}

.header a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
}

.header a:hover {
    text-decoration: underline;
}

.main-banner {
    background-color: #1e90ff;
    color: white;
    text-align: center;
    padding: 40px 20px;
    width: 100%;
}

.hot-tours {
    padding: 40px 20px;
    background-color: white;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
    width: 90%;
    max-width: 1200px;
}

.tour-grid {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
}

.tour-card {
    background-color: #f1f1f1;
    margin: 10px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    flex: 1 1 calc(25% - 40px);
    box-sizing: border-box;
    text-align: left;
}

.tour-card h3 {
    margin-top: 0;
    font-size: 18px;
}

.tour-card p {
    font-size: 14px;
    margin: 10px 0;
}

.tour-card img {
    width: 100%;
    border-radius: 8px;
}

.container {
    background-color: white;
    padding: 40px 20px;
    margin: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    text-align: left;
    width: 90%;
    max-width: 600px;
}

.container h2 {
    text-align: left;
    margin-bottom: 20px;
    font-size: 24px;
}

.container label {
    display: block;
    margin: 10px 0 5px;
    text-align: left;
}

.container input, .container select {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.container button {
    width: 100%;
    padding: 10px;
    background-color: #d77a61;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
}

.container button:hover {
    background-color: #b0583e;
}
.cover-photo{
 position: reletive;
 background: url(../)
 }

.styled-image {
    width: 300px;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}
        .back-button {
    background-color: #333;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    text-align: ;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.back-button:hover {
    background-color: #555;
}

        </style>
</head>
<body>
<div class="card">
   <a href="{{ url_for('index') }}" class="back-button">
    Назад
</a>
</div>

    <section class="main-banner">
        <h2>Лето ближе - цены на отдых ниже! Бронируй сейчас и экономь до 50%!</h2>
    </section>

    <!-- Горящие туры -->
    <section class="hot-tours">
        <h3>Удивительные места Казахстана, в которых нужно побывать каждому</h3>
        <div class="tour-grid">
            <!-- Карточка тура -->
           <div class="tour-card">
               <section id="new" class="about-section">
        <h3>Озера Көлсай</h3>
        <picture>
            <img src="https://24.kz/images/AIGUL/96/4.jpg"   width="825" height="500">
        </picture>
                </section>
               </div>
</div>
            <div class="tour-card">
                <section id="new" class="about-section">
        <h3>Город Туркестан</h3>
        <picture>
              <img src="https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcSZvN1k5YWPw9E5CgrAqk1FOpqYAMjylOd2yt9IVMlDT7gAuZGib97Pag_KblY2RWk8jetva8PUl2dsc5LogDNRjbc6-8l1mHAXa9I_Bg" alt="image/jpg" width="825" height="500">
  <img src="https://cf.bstatic.com/xdata/images/hotel/max1024x768/297278428.jpg?k=975b8c281d4b759e4d657debd38d4882180fe3c4537ae26f6f92af387211dfc4&o=&hp=1.jpg" alt="image/jpg" width="825" height="500">
        </picture>
                </section>
            </div>

                 <div class="tour-card">
                <section id="new" class="about-section">
        <h3>Озеро Каинды, Алматинская область</h3>
        <picture>
            <img src="https://static.tildacdn.com/tild3166-3263-4139-a537-383735353634/mertvoe-1200x675-min.jpg" alt="image/jpg" width="825" height="500">
  <img src="https://visitalmaty.crocos.kz/wp-content/uploads/2022/05/%D0%BE%D0%B7%D0%B5%D1%80%D0%B0-%D0%BA%D0%B0%D0%B9%D1%8B%D0%BD%D0%B4%D1%8B.jpg" alt="image/jpg" width="825" height="500">
        </picture>
                </section>
        </div>

    <section class="zayavka">
    <div class="container">
        <h2>Оставьте заявку и мы Вам перезвоним</h2>
        <form action="/submit" method="post">

            <label for="destination">Направление</label>
<select id="destination" name="destination" required>
    <option value="Туркестан">Туркестан</option>
    <option value="Заилийское Алатау, Алматинская область">Заилийское Алатау, Алматинская область</option>
    <option value="Чарынский каньон, Алматинская область">Чарынский каньон, Алматинская область</option>
    <option value="Озера Кольсай, Алматинская область">Озера Кольсай, Алматинская область</option>
    <option value="Пик Хан-Тенгри, горы Центрального Тянь-Шаня">Пик Хан-Тенгри, горы Центрального Тянь-Шаня</option>
</select>
            <label for="city">Город вылета</label>
            <input type="text" id="city" name="city" required>

            <label for="date">Дата</label>
            <input type="date" id="date" name="date" required>

            <label for="duration">Продолжительность (дней)</label>
            <input type="number" id="duration" name="duration" required>

            <label for="people">Количество людей</label>
            <input type="number" id="people" name="people" required>

            <label for="budget">Бюджет (в тенге)</label>
            <input type="number" id="budget" name="budget" required>

            <label for="tour-type">Тип тура</label>
            <select id="tour-type" name="tour-type" required>
                <option value="beach">Пляжный отдых</option>
                <option value="adventure">Приключенческий тур</option>
                <option value="city">Городской тур</option>
                <option value="cruise">Круиз</option>
                <option value="ski">Горнолыжный тур</option>
            </select>

            <label for="email">Ваш Email</label>
            <input type="email" id="email" name="email" placeholder="Введите ваш email" required>

            <button type="submit">Найти тур</button>
        </form>
    </div>
</section>
</body>
</html>
